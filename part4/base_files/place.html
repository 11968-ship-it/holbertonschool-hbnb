<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Place Details</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="Application logo" class="logo header-logo" />
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html" class="login-button">Login</a>
        <button id="logout-btn" style="display: none;">Logout</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Place details section -->
    <section id="place-details" class="place-details">
      <p>Loading place details...</p>
    </section>

    <!-- Reviews section -->
    <section id="reviews-section" class="reviews">
      <h2>Reviews</h2>
      <div id="reviews-container">
        <p>Loading reviews...</p>
      </div>
    </section>

    <!-- Add review button (only for logged-in users) -->
    <section id="add-review" style="display:none;">
      <a class="details-button" id="add-review-link" href="#">Add Review</a>
    </section>
  
  </main>


  <!-- Footer -->
  <footer>



    <hr>
    <p>© 2026 All rights reserved, made with ♥ by students at Holberton School.</p>

    <div>
      <ul>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Cookie Policy</a></li>
        </ul>
    </div>
  </footer>

  <script src="scripts.js" defer></script>
</body>
</html>
