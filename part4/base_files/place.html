<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Place Details</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="Application logo" class="logo header-logo" />
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html" class="login-button">Login</a>
        <button id="logout-btn" style="display: none;">Logout</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Place details section -->
    <section id="place-details" class="place-details"></section>

    <hr class="section-divider">
    
    <div class="delete-wrapper">
    <button id="delete-place-btn" class="details-button danger" style="display:none;">
      <i class="fa fa-trash"></i> Delete Place
    </button>
    </div>

    <hr class="section-divider">

    <!-- Review summary -->
    <section class="review-summary">
      <div class="summary-header">
        <div class="overall-rating">
          <i class="fas fa-star"></i>
          <span class="rating-value">5.0</span>
          <span class="review-count"> • 2 reviews</span>
        </div>
      </div>

      <div class="summary-content">
        <div class="rating-distribution">
          <div class="rating-bar-row">
            <span>5</span>
            <div class="bar-container">
              <div class="bar filled" style="width: 100%;"></div>
            </div>
          </div>
          <div class="rating-bar-row">
            <span>4</span>
            <div class="bar-container">
              <div class="bar" style="width: 40%;"></div>
            </div>
          </div>
          <div class="rating-bar-row">
            <span>3</span>
            <div class="bar-container">
              <div class="bar" style="width: 20%;"></div>
            </div>
          </div>
          <div class="rating-bar-row">
            <span>2</span>
            <div class="bar-container">
              <div class="bar" style="width: 10%;"></div>
            </div>
          </div>
          <div class="rating-bar-row">
            <span>1</span>
            <div class="bar-container">
              <div class="bar" style="width: 5%;"></div>
            </div>
          </div>
        </div>

        <div class="category-ratings">
          <div class="category">
            <div class="category-name"><i class="fas fa-broom"></i> Cleanliness</div>
            <div class="category-score">5.0</div>
          </div>
          <div class="category">
            <div class="category-name"><i class="fas fa-check-circle"></i> Accuracy</div>
            <div class="category-score">5.0</div>
          </div>
          <div class="category">
            <div class="category-name"><i class="fas fa-key"></i> Check-in</div>
            <div class="category-score">5.0</div>
          </div>
          <div class="category">
            <div class="category-name"><i class="fas fa-comment-alt"></i> Communication</div>
            <div class="category-score">5.0</div>
          </div>
          <div class="category">
            <div class="category-name"><i class="fas fa-map"></i> Location</div>
            <div class="category-score">5.0</div>
          </div>
          <div class="category">
            <div class="category-name"><i class="fas fa-tag"></i> Value</div>
            <div class="category-score">4.5</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Reviews -->
    <section class="reviews" id="reviews-section">
      <div id="reviews-list"></div>
    </section>

    <!-- Add review form -->
    <section id="add-review" style="display:none;">
      <a class="details-button" id="add-review-link" href="#">Add Review</a>
    </section>
  </main>


  <!-- Footer -->
  <footer>



    <hr>
    <p>© 2026 All rights reserved, made with ♥ by students at Holberton School.</p>

    <div>
      <ul>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Cookie Policy</a></li>
        </ul>
    </div>
  </footer>

  <script src="scripts.js" defer></script>
</body>
</html>
