<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HBnB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="brand">
                <a href="index.html">
                    <img src="images/logo.png" alt="HBnB Logo" class="header-logo">
                </a>
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </nav>
            <div></div>
        </div>
    </header>

    <main>
        <div class="signup-container">
            <h1>Create Account</h1>
            
            <form id="signup-form" class="signup-form">
                <div>
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                
                <div>
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
                
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div>
                    <label for="password">Password (min 6 characters)</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                
                <button type="submit" id="signup-btn">Create Account</button>
                
                <div id="error-message" class="form-error"></div>
            </form>
            
            <div class="signup-footer">
                Already have an account? 
                <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 HBnB. All rights reserved.</p>
        <ul>
            <li><a href="#">Privacy</a></li>
            <li><a href="#">Terms</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </footer>

    <script src="scripts.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', handleSignupForm);
    </script>
</body>
</html>
