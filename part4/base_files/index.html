<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB Home Page</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="places.html" class="brand">
                <img src="images/logo.png" alt="Logo" class="header-logo">
            </a>
            <nav>
                <a href="login.html" id="login-link">Login</a>
                <button id="logout-btn" style="display: none;">Logout</button>
            </nav>
        </div>
    </header>
    
    <main>
        <search class="search-bar">
            <form id="filter-form">
        <!-- WHERE: Destination -->
                <div class="filter-group">
                    <label for="location">Where</label>
                    <input type="text" id="location" placeholder="Search destinations" list="location-suggestions">
                    <datalist id="location-suggestions">
                        <option value="Paris, France">
                        <option value="New York, USA">
                    </datalist>
                </div>
                <!-- WHEN: Check-in & Checkout -->
                <div class="filter-group">
                    <label for="check-in">When</label>
                    <div class="date-inputs">
                        <input type="date" id="check-in" name="check-in">
                        <input type="date" id="check-out" name="check-out">
                    </div>
                </div>
                <!-- WHO: Guests -->
                <div class="filter-group">
                    <label for="guests">Who</label>
                    <input type="number" id="guests" min="1" placeholder="Add guests">
                </div>
                <button type="submit" class="search-btn">
                    <span class="icon">🔍</span>
                </button>
            </form>
        </search>


<section class="price-filter" aria-label="Price filter">
  <div class="price-filter-header">
    <label for="price-range" class="price-label">Max Price</label>

    <button type="button" id="price-reset" class="price-reset">
      Reset
    </button>
  </div>

  <div class="price-range-row">
    <img src="images/Saudi_Riyal_Symbol-1.png" alt="SAR" class="currency-icon" />

    <input
      type="range"
      id="price-range"
      min="0"
      max="3000"
      step="50"
      value="2000"
      aria-describedby="price-value"
    />

    <output id="price-value" for="price-range" class="price-value"></output>
  </div>

  <div class="price-hints">
    <span>0</span>
    <span>3000+</span>
  </div>
</section>

<section id="places-list"></section>

    </main>
    
       <!-- Footer -->
  <footer>

    <hr>
    <p>© 2026 All rights reserved, made with ♥ by students at Holberton School.</p>

    <div>
      <ul>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Cookie Policy</a></li>
        </ul>
    </div>
  </footer>
    <script src="scripts.js"></script>

    
</body>
</html>
