<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB Home Page</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="places.html" class="brand">
                <img src="images/logo.png" alt="Logo" class="header-logo">
            </a>
            <nav>
                <a href="login.html" id="login-link">Login</a>
                <a href="login.html" id="signup-link">Sign up</a>
            </nav>
        </div>
    </header>
    
    <main>
        <search class="search-bar">
            <form id="filter-form">
        <!-- WHERE: Destination -->
                <div class="filter-group">
                    <label for="location">Where</label>
                    <input type="text" id="location" placeholder="Search destinations" list="location-suggestions">
                    <datalist id="location-suggestions">
                        <option value="Paris, France">
                        <option value="New York, USA">
                    </datalist>
                </div>
                <!-- WHEN: Check-in & Checkout -->
                <div class="filter-group">
                    <label for="check-in">When</label>
                    <div class="date-inputs">
                        <input type="date" id="check-in" name="check-in">
                        <input type="date" id="check-out" name="check-out">
                    </div>
                </div>
                <!-- WHO: Guests -->
                <div class="filter-group">
                    <label for="guests">Who</label>
                    <input type="number" id="guests" min="1" placeholder="Add guests">
                </div>
                <button type="submit" class="search-btn">
                    <span class="icon">🔍</span>
                </button>
            </form>
        </search>

<section id="filter" class="price-filter">
  <label for="price-range">Max Price:</label>

  <div class="range-wrap">
    <img src="images/Saudi_Riyal_Symbol-1.png" alt="SAR" class="currency-icon" />
    <input type="range" id="price-range" min="0" max="3000" step="50" value="2000" />
    <span id="price-value">2000 SAR</span>
  </div>
</section>

        <section id="places-list">
            <article class="place-card">
                <div class="place-images">
                    <img src="images/place-01.jpg" alt="Place Image">
                </div>
                <h3>Cozy Beachfront Cottage</h3>
                <p>Price per night: <img src="images/Saudi_Riyal_Symbol-1.png" alt="SAR symbol" class="currency-icon">1400</p>
                <a href="place.html?id=1" class="details-button">View Details</a>
            </article>
        </section>
    </main>
    
       <!-- Footer -->
  <footer>

    <hr>
    <p>© 2026 All rights reserved, made with ♥ by students at Holberton School.</p>

    <div>
      <ul>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Cookie Policy</a></li>
        </ul>
    </div>
  </footer>
    <script src="scripts.js"></script>

    
</body>
</html>
