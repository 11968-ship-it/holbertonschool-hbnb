<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="places.html" class="brand">
                <img src="images/logo.png" alt="Logo" class="header-logo">
            </a>
            <nav>
                <a href="login.html" id="login-link">Login</a>
            </nav>
        </div>
    </header>
    
    <main>
        <search class="search-bar">
            <form id="filter-form">
        <!-- WHERE: Destination -->
                <div class="filter-group">
                    <label for="location">Where</label>
                    <input type="text" id="location" placeholder="Search destinations" list="location-suggestions">
                    <datalist id="location-suggestions">
                        <option value="Paris, France">
                        <option value="New York, USA">
                    </datalist>
                </div>
                <!-- WHEN: Check-in & Checkout -->
                <div class="filter-group">
                    <label for="check-in">When</label>
                    <div class="date-inputs">
                        <input type="date" id="check-in" name="check-in">
                        <input type="date" id="check-out" name="check-out">
                    </div>
                </div>
                <!-- WHO: Guests -->
                <div class="filter-group">
                    <label for="guests">Who</label>
                    <input type="number" id="guests" min="1" placeholder="Add guests">
                </div>
                <button type="submit" class="search-btn">
                    <span class="icon">🔍</span>
                </button>
            </form>
        </search>

        <section id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="all">All Prices</option>
                <option value="50">$50</option>
                <option value="100">$100</option>
                <option value="200">$200+</option>
            </select>
        </section>
        <section id="places-list">
            <article class="place-card">
                <div class="place-images">
                    <img src="images/place-01.jpg" alt="Place Image">
                </div>
                <h3>Cozy Beachfront Cottage</h3>
                <p>Price per night:<img src="images/Saudi_Riyal_Symbol-1.png" alt="SAR symbol" class="currency-icon"> 220</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>
        </section>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
