<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Review</title>
  <link rel="icon" href="images/icon.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="Application logo" class="logo header-logo" />
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="login.html" id="login-link" class="login-button">Login</a>
        <button id="logout-btn" style="display:none;">Logout</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Place Preview -->
    <section class="review-place-preview">
      <h2>Write a Review</h2>
      <div class="place-preview-card">
        <img id="review-place-image" src="images/place-01.jpg" alt="Place" class="preview-image">
        <div class="preview-info">
          <h3 id="review-place-title">Loading...</h3>
          <p id="review-place-location"></p>
        </div>
      </div>
    </section>

    <!-- Add Review Form -->
    <section class="add-review">
      <h2>Your Review</h2>
      
      <form id="review-form" class="form">
        <div class="form-group">
          <label for="review-rating">Rating:</label>
          <select id="review-rating" name="rating" required>
            <option value="">Select rating</option>
            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
            <option value="4">⭐⭐⭐⭐ Good</option>
            <option value="3">⭐⭐⭐ Average</option>
            <option value="2">⭐⭐ Poor</option>
            <option value="1">⭐ Terrible</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="review-text">Your Review:</label>
          <textarea id="review-text" name="review" rows="6" placeholder="Share your experience..." required></textarea>
        </div>
        
        <div class="form-actions">
          <button type="button" class="cancel-btn" onclick="history.back()">Cancel</button>
          <button type="submit" class="submit-btn">Submit Review</button>
        </div>
        
        <div id="review-error" class="form-error"></div>
      </form>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 All rights reserved.</p>
  </footer>

  <script src="scripts.js" defer></script>
</body>
</html>
