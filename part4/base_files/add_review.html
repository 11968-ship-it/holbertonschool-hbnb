<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
  <div class="header-container">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="Application logo" class="logo header-logo">
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html" id="login-link" class="login-button">Login</a>
        <button id="logout-btn" style="display: none;">Logout</button>
    </nav>
  </div>
</header>

    <main>
        <section class="add-review">
            <h2>Add a Review</h2>

            <!-- Hidden field to identify the place -->
            <form id="review-form" class="form">
            
                <label for="review">Your Review:</label>
                <textarea id="review-text" name="review" required></textarea>

                <label for="rating">Rating:</label>
                <select id="review-rating" name="rating" required>
                    <option value="">Select rating</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <button type="submit">Submit Review</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 All rights reserved.</p>
    </footer>

    <script src="scripts.js" defer></script>

</body>
</html>
