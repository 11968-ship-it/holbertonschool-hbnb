<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
      <main class="modal-overlay">
  <section class="modal-airbnb" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    
    <header class="modal-header">
      <button type="button" class="modal-close" aria-label="Close">×</button>
      <h3 id="modal-title" class="modal-header-title">Log in</h3>
      <div class="modal-header-spacer"></div>
    </header>

    <div class="modal-body">
      <div class="logo-container">
        <img src="images/logo.png" alt="Logo" class="logo">
      </div>

      <h2 class="modal-welcome">Welcome back</h2>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button id="login-btn" type="submit">Login</button>
        <p id="login-error" class="form-error"></p>
      </form>
    </div>

  </section>
</main>
    <script src="scripts.js"></script>
</body>
</html>
